{% extends "layout.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box card animate-fade-in">
        <div class="text-center mb-4">
            <h2 style="color: var(--accent-color); margin:0;">Welcome Back</h2>
            <p style="color: var(--text-muted);">Sign in to continue automation</p>
        </div>

        <form method="POST">
            <div class="mb-4">
                <label class="mb-2" style="display:block; color: #aaa;">Username</label>
                <div style="position:relative;">
                    <i class="fas fa-user" style="position:absolute; left:12px; top:14px; color: #666;"></i>
                    <input type="text" name="username" placeholder="Enter username" style="padding-left: 40px;"
                        required>
                </div>
            </div>

            <div class="mb-4">
                <label class="mb-2" style="display:block; color: #aaa;">Password</label>
                <div style="position:relative;">
                    <i class="fas fa-lock" style="position:absolute; left:12px; top:14px; color: #666;"></i>
                    <input type="password" name="password" placeholder="Enter password" style="padding-left: 40px;"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="padding: 12px; font-size: 1rem;">
                LOGIN <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="text-center" style="margin-top: 20px;">
            <a href="{{ url_for('register') }}"
                style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
                Create new account
            </a>
        </div>
    </div>
</div>
{% endblock %}
