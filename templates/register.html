{% extends "layout.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box card animate-fade-in">
        <div class="text-center mb-4">
            <h2 style="color: var(--success-color); margin:0;">Join Us</h2>
            <p style="color: var(--text-muted);">Create your solver account</p>
        </div>

        <form method="POST">
            <div class="mb-4">
                <label class="mb-2" style="display:block; color: #aaa;">Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="mb-4">
                <label class="mb-2" style="display:block; color: #aaa;">Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="background: var(--success-color);">
                REGISTER
            </button>
        </form>

        <div class="text-center" style="margin-top: 20px;">
            <a href="{{ url_for('login') }}" style="color: var(--text-muted);">
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
