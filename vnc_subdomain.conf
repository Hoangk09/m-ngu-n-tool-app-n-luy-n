# Nginx config for VNC subdomain
# File: /etc/nginx/sites-available/vnc.1amsleep.xyz

server {
    listen 80;
    server_name vnc.1amsleep.xyz;

    # Proxy all VNC ports dynamically
    location ~ ^/(\d+)/(.*)$ {
        set $vnc_port $1;
        proxy_pass http://127.0.0.1:$vnc_port/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Default port 6080
    location / {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

# --- SETUP COMMANDS ---
# 1. Copy this file to server:
#    scp vnc_subdomain.conf root@YOUR_SERVER:/etc/nginx/sites-available/vnc.1amsleep.xyz
#
# 2. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/vnc.1amsleep.xyz /etc/nginx/sites-enabled/
#
# 3. Test and reload:
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 4. Create DNS record in Cloudflare:
#    Type: A | Name: vnc | Value: YOUR_SERVER_IP | Proxy: OFF (grey cloud)
