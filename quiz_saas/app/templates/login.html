<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Solver Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-2xl shadow-2xl w-96">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">🎯 Quiz Solver</h1>
            <p class="text-gray-500 mt-2">SaaS Platform</p>
        </div>

        <form method="POST" action="/login">
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
                <input name="username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    type="text" placeholder="Enter username" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                <input name="password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    type="password" placeholder="••••••••" required>
            </div>
            <button
                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:opacity-90 transition duration-300 shadow-lg"
                type="submit">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-500 text-sm">Don't have an account?
                <a href="/register" class="text-blue-600 hover:underline font-semibold">Register</a>
            </p>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-200">
            <p class="text-xs text-gray-400 text-center">Demo: username <code
                    class="bg-gray-100 px-1 rounded">demo</code> / password <code
                    class="bg-gray-100 px-1 rounded">demo</code></p>
        </div>
    </div>
</body>

</html>
